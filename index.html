<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Football AI</title>
<style>
:root{--bg:#071018;--panel:#0d1822;--panel2:#111f2b;--line:#213342;--text:#eef5fa;--muted:#8fa4b4;--accent:#45b6ff;--green:#39d98a;--red:#ff6675;--gold:#ffc857}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#061019,#09151f 55%,#071018);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{display:flex;min-height:100vh}.sidebar{width:235px;background:#08121b;border-right:1px solid var(--line);padding:22px 14px;position:fixed;inset:0 auto 0 0}.brand{font-weight:800;font-size:19px;padding:8px 12px 24px}.brand span{color:var(--accent)}nav button{width:100%;text-align:left;background:transparent;color:var(--muted);border:0;padding:12px;border-radius:9px;font-size:14px;margin:2px 0;cursor:pointer}nav button.active,nav button:hover{background:#102333;color:#fff}.main{margin-left:235px;width:calc(100% - 235px);padding:28px 34px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.title{font-size:30px;font-weight:800;margin:5px 0}.sub{color:var(--muted);font-size:14px}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px #39d98a}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.toolbar input,.toolbar select{background:#0c1822;border:1px solid var(--line);color:#fff;border-radius:8px;padding:10px 12px}.btn{background:#123149;color:#fff;border:1px solid #24506d;border-radius:8px;padding:10px 14px;cursor:pointer}.btn:hover{background:#17415d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}.card{background:linear-gradient(180deg,#0d1924,#0b151e);border:1px solid var(--line);border-radius:13px;overflow:hidden}.cardhead{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px}.teams{font-size:17px;font-weight:750}.time{font-size:12px;color:var(--muted);margin-top:6px}.book{font-size:11px;color:var(--muted)}.market{padding:14px 16px;border-bottom:1px solid #1a2a37}.market:last-child{border-bottom:0}.market-title{display:flex;justify-content:space-between;color:#c8d7e1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.bookbox{background:#101f2b;border:1px solid #203543;border-radius:8px;padding:9px}.bookname{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.price{font-weight:750;font-size:14px;margin-top:3px}.best{border-color:#2f8b67;background:#0d251d}.best .bookname{color:#75dfae}.empty{padding:45px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.error{padding:16px;border:1px solid #6e3038;background:#241218;color:#ffb7bf;border-radius:10px;margin-bottom:16px}.footer{color:#718797;font-size:11px;margin-top:22px}.hide{display:none}@media(max-width:800px){.sidebar{position:static;width:100%;height:auto}.app{display:block}.main{margin-left:0;width:100%;padding:20px}.sidebar nav{display:flex;overflow:auto}.sidebar nav button{min-width:max-content}.top{display:block}.status{margin-top:12px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">COLLEGE <span>FOOTBALL AI</span></div>
  <nav>
    <button>Dashboard</button>
    <button>AI Picks</button>
    <button class="active">Games & Markets</button>
    <button>Teams</button>
    <button>Parlay Lab</button>
    <button>Model Lab</button>
    <button>What We're Learning</button>
  </nav>
</aside>
<main class="main">
  <div class="top">
    <div>
      <div class="eyebrow">Live market intelligence</div>
      <div class="title">Games & Markets</div>
      <div class="sub">Real college football schedules and sportsbook markets from your live data feed.</div>
    </div>
    <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span></div>
  </div>

  <div class="toolbar">
    <input id="search" placeholder="Search team…" />
    <select id="week"><option value="">All weeks</option></select>
    <button class="btn" id="refresh">Refresh live data</button>
  </div>

  <div id="error" class="error hide"></div>
  <div id="games" class="grid"></div>
  <div class="footer">Odds are displayed only when returned by the connected sportsbook feed. No odds are invented or substituted.</div>
</main>
</div>

<script>
const WORKER = "https://cfb-ai-api.williamryanshaffer.workers.dev/";
const state = { games: [], odds: [], loaded: false };

const $ = id => document.getElementById(id);

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function dateTime(g){
  const d = g.start_date || g.startDate || g.commence_time || g.start_time;
  if(!d) return "Time unavailable";
  const dt = new Date(d);
  if(Number.isNaN(dt.getTime())) return esc(d);
  return dt.toLocaleString([], {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
}
function teamNames(g){
  return {
    home: g.home_team || g.homeTeam || g.home || "Home Team",
    away: g.away_team || g.awayTeam || g.away || "Away Team"
  };
}
function normalizeOddsPayload(data){
  // Accept several common Worker response shapes without changing the Worker.
  let games = data.games || data.data || [];
  if(!Array.isArray(games)) games = [];
  let odds = data.odds || [];
  if(!Array.isArray(odds)) odds = [];

  // If the Worker already merged odds into each game, keep that.
  const merged = games.map(g => {
    const names = teamNames(g);
    const key = `${names.away}|${names.home}`;
    const related = odds.filter(o => {
      const a = o.away_team || o.awayTeam || o.away;
      const h = o.home_team || o.homeTeam || o.home;
      return a === names.away && h === names.home;
    });
    return {...g, _relatedOdds: related};
  });
  return merged;
}
function marketRows(g){
  const names = teamNames(g);
  let books = g.bookmakers || g.bookmakers_data || g.odds_bookmakers || [];
  if(!Array.isArray(books)) books = [];
  if(!books.length && Array.isArray(g._relatedOdds)) {
    books = g._relatedOdds.flatMap(o => o.bookmakers || []);
  }

  const spread = [], total = [], ml = [];
  for(const b of books){
    const bname = b.title || b.name || b.key || "Sportsbook";
    const markets = b.markets || [];
    for(const m of markets){
      const key = String(m.key || m.market || "").toLowerCase();
      const outcomes = m.outcomes || m.selections || [];
      if(key.includes("spread")){
        spread.push({book:bname,outcomes});
      } else if(key.includes("total")){
        total.push({book:bname,outcomes});
      } else if(key.includes("h2h") || key.includes("moneyline") || key === "ml"){
        ml.push({book:bname,outcomes});
      }
    }
  }
  // Some Worker versions expose direct arrays on the game.
  if(!spread.length && Array.isArray(g.spreads)) spread.push(...g.spreads.map(x=>({book:x.bookmaker||x.book||"Sportsbook",outcomes:x.outcomes||x.lines||[]})));
  if(!total.length && Array.isArray(g.totals)) total.push(...g.totals.map(x=>({book:x.bookmaker||x.book||"Sportsbook",outcomes:x.outcomes||x.lines||[]})));
  if(!ml.length && Array.isArray(g.moneylines)) ml.push(...g.moneylines.map(x=>({book:x.bookmaker||x.book||"Sportsbook",outcomes:x.outcomes||x.lines||[]})));

  return {spread,total,ml};
}
function outcomeText(o){
  const name = o.name || o.team || o.description || "";
  const point = o.point ?? o.line;
  const price = o.price ?? o.odds;
  return `${esc(name)}${point !== undefined && point !== null ? " " + esc(point) : ""}${price !== undefined && price !== null ? "  " + esc(price) : ""}`;
}
function renderMarket(title, rows){
  if(!rows.length) return `<div class="market"><div class="market-title"><span>${title}</span><span>Unavailable</span></div><div class="book"><em>No live ${title.toLowerCase()} returned by the feed.</em></div></div>`;
  return `<div class="market"><div class="market-title"><span>${title}</span><span>${rows.length} book${rows.length===1?"":"s"}</span></div>
    <div class="books">${rows.map((r,i)=>`<div class="bookbox ${i===0?"best":""}"><div class="bookname">${esc(r.book)}</div>${(r.outcomes||[]).map(o=>`<div class="price">${outcomeText(o)}</div>`).join("")}</div>`).join("")}</div></div>`;
}
function render(){
  const q = $("search").value.trim().toLowerCase();
  const filtered = state.games.filter(g=>{
    const n=teamNames(g);
    return !q || n.home.toLowerCase().includes(q) || n.away.toLowerCase().includes(q);
  });
  if(!filtered.length){
    $("games").innerHTML = `<div class="empty">No games match the current filter.</div>`;
    return;
  }
  $("games").innerHTML = filtered.map(g=>{
    const n=teamNames(g), m=marketRows(g);
    return `<article class="card">
      <div class="cardhead">
        <div><div class="teams">${esc(n.away)} @ ${esc(n.home)}</div><div class="time">${dateTime(g)}</div></div>
        <div class="book">${esc(g.venue || g.location || "")}</div>
      </div>
      ${renderMarket("Spread",m.spread)}
      ${renderMarket("Moneyline",m.ml)}
      ${renderMarket("Total",m.total)}
    </article>`;
  }).join("");
}
async function load(){
  $("error").classList.add("hide");
  $("statusText").textContent="Updating…";
  $("statusDot").style.background="var(--gold)";
  try{
    const year = new Date().getFullYear();
    const url = `${WORKER}?year=${year}`;
    const res = await fetch(url, {cache:"no-store"});
    if(!res.ok) throw new Error(`Worker returned HTTP ${res.status}`);
    const data = await res.json();
    state.games = normalizeOddsPayload(data);
    state.loaded = true;
    render();
    $("statusText").textContent=`Live • ${state.games.length} games`;
    $("statusDot").style.background="var(--green)";
  }catch(err){
    console.error(err);
    $("statusText").textContent="Connection error";
    $("statusDot").style.background="var(--red)";
    $("error").textContent=`Could not load live market data: ${err.message}. Check the Worker URL and browser console.`;
    $("error").classList.remove("hide");
    $("games").innerHTML="";
  }
}
$("refresh").addEventListener("click",load);
$("search").addEventListener("input",render);
load();
</script>
</body>
</html>
